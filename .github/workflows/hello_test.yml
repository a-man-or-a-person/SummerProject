name: Run Tests

on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements
        pip install pytest pytest-asyncio httpx

    - name: Run Python tests
      env:
        TEST_MODE: "True"
        POSTG: ""  # Используем SQLite для тестов
      run: |
        mkdir -p test_db
        touch test_db/test.db
        pytest -v tests/